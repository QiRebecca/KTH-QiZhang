seed: 17
output_dir: artifacts
data_dir: data

runtime:
  profile: portable_single_gpu
  device: auto
  dtype: bfloat16

model:
  name: "Qwen/Qwen2.5-Coder-1.5B-Instruct"
  target_layer_label: 18
  target_block_index_zero_based: 17
  hidden_states_index: 18
  max_length: 384
  dtype: "bfloat16"

data:
  dataset_name: "CodeSearchNet Python or compatible"
  max_functions_train: 8000
  max_functions_val: 1000
  max_functions_test: 1000
  activations_per_function: 4
  min_tokens: 64
  max_tokens: 384
  deduplicate_by_code_hash: true
  split_policy: "by_function_id_and_code_hash"

activation:
  vector_dtype_store: "float16"
  normalize_for_dir_metrics: true
  extraction_batch_size: 32

bootstrap_text:
  max_tokens: 60
  include_summary: true
  include_token_role: true
  include_nearby_syntax_hint: true
  no_full_code_copy: true
  no_pass_fail_info: true

av:
  injection_token: "<ACT>"
  prompt_template: |
    You are describing one residual-stream activation from a code language model.
    The activation vector is inserted inside <act> tags.
    Write a concise natural-language explanation of the code-relevant information.

    <act><ACT></act>
    Explanation:
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  epochs_sft: 1
  epochs_rerank_sft: 1
  max_new_tokens: 80
  generation_temperature_eval: 0.0
  generation_temperature_rerank: 0.7
  rerank_samples_per_activation: 4
  generation_batch_size: 32
  micro_batch_size: 8
  gradient_accumulation_steps: 2

ar:
  truncate_to_layers: 19
  use_final_token_state: true
  value_head: "Linear(d,d,bias=False)"
  train_loss: "raw_mse"
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  epochs: 1
  train_two_reconstructors: true
  micro_batch_size: 16
  gradient_accumulation_steps: 1

metrics:
  primary: "FVE_raw"
  secondary: ["FVE_dir", "cosine", "MSE_nrm"]
  bootstrap_ci: true
  bootstrap_unit: "function_id"
  bootstrap_samples: 1000

baselines:
  mean_predictor: true
  shuffled_av_text: true
  role_preserving_shuffled_av_text: true
  no_injection_av: true
  deterministic_template_bootstrap_text_to_ar: true
